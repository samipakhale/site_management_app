name: site_management_app
description: "Site Management Application without Firebase"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  shared_preferences: ^2.2.2
  pdf: ^3.10.4
  printing: ^5.11.0
  fl_chart: ^0.68.0
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: "^0.13.1"

flutter:
  uses-material-design: true

  assets:
    - assets/images/app_logo.png

flutter_launcher_icons:
  image_path: "assets/images/Site Managment.png"
  android: true
  ios: true

analyzer:
  errors:
    use_build_context_synchronously: ignore